<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-card__title">Sign in</h1>
    <p class="auth-card__subtitle">Welcome back to Aurelia.</p>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <label class="auth-form__field">
        <span class="auth-form__label">Email</span>
        <input type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="auth-form__error">Enter a valid email address.</span>
        }
      </label>

      <label class="auth-form__field">
        <span class="auth-form__label">Password</span>
        <div class="auth-form__password">
          <input
            [type]="hidePassword() ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="auth-form__visibility-toggle"
            [attr.aria-label]="hidePassword() ? 'Show password' : 'Hide password'"
            (click)="togglePasswordVisibility()"
          >
            <mat-icon aria-hidden="true">{{
              hidePassword() ? 'visibility' : 'visibility_off'
            }}</mat-icon>
          </button>
        </div>
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="auth-form__error">Password must be at least 6 characters.</span>
        }
      </label>

      @if (errorMessage(); as message) {
        <p class="auth-form__banner auth-form__banner--error" role="alert">{{ message }}</p>
      }

      <button type="submit" mat-flat-button class="auth-form__submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="auth-card__footer">New to Aurelia? <a routerLink="/register">Create an account</a></p>
  </div>
</div>
