<section class="featured-products" aria-labelledby="featured-products-heading">
  <div class="featured-products__header">
    <div>
      <p class="featured-products__eyebrow">Handpicked</p>
      <h2 id="featured-products-heading" class="featured-products__title">Featured Products</h2>
    </div>
    <a routerLink="/shop" class="featured-products__view-all">View All</a>
  </div>

  <div class="featured-products__grid">
    @for (product of featuredProducts(); track product.id) {
      <app-product-card [product]="product" />
    }
  </div>
</section>
